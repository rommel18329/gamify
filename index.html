<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Sprout</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0D1117">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="errBox">
  <h4>SOMETHING BROKE — screenshot this</h4>
  <pre id="errText"></pre>
  <button onclick="document.getElementById('errBox').style.display='none'">DISMISS</button>
</div>

<div id="boot"><div class="in"><div class="spin"></div><p>Loading</p></div></div>

<div id="title">
  <div class="t-in">
    <h1 class="t-name">SPROUT</h1>
    <p class="t-sub">THE PROPERTY</p>
    <div id="tAlert"></div>
    <div class="t-stats" id="tStats"></div>
    <button class="bigbtn" onclick="enterWorld()">ENTER</button>
    <button class="bigbtn ghost" onclick="openLog()">LOG TODAY</button>
    <button class="bigbtn ghost" onclick="openBackup()">BACKUP SAVE</button>
  </div>
</div>

<div id="game">
  <canvas id="cv"></canvas>
  <div id="vitals"></div>
  <div id="topright">
    <div class="chip" id="cashChip">💵 0</div>
    <div class="chip" id="standChip">⭐ 0</div>
    <button class="hbtn accent" onclick="openLog()">LOG</button>
    <button class="hbtn" onclick="openStats()">STATS</button>
    <button class="hbtn" id="muteBtn" onclick="toggleMute()">🔊</button>
    <button class="hbtn" id="camModeBtn" onclick="toggleCameraMode()">1ST PERSON</button>
    <button class="hbtn" onclick="backToTitle()">MENU</button>
  </div>
  <button id="exitVehicleBtn" class="hbtn accent"
    style="display:none;position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);z-index:10;"
    onclick="exitDriveMode()">EXIT VEHICLE</button>
  <div id="raidBar"></div>
  <div id="prompt">
    <div class="pb"><div class="pl"></div><div class="ph"></div></div>
    <button onclick="useTarget()">USE</button>
  </div>
  <div id="hint">TAP GROUND TO WALK · TAP THINGS TO USE · DRAG TO LOOK</div>
</div>

<div class="sheet" id="sheet"><div class="sc">
  <div class="sh"><h3 id="sheetTitle"></h3><button class="x" onclick="closeSheet()">✕</button></div>
  <div id="sheetBody"></div>
</div></div>

<div class="toast" id="toast"></div>

<!-- Load order matters: errors.js installs the global error handler before anything
     else can throw; vendor/three.min.js must exist before data/game/ui touch THREE;
     data.js defines state + economy that game.js and ui.js both read from. -->
<script src="js/errors.js"></script>
<script src="js/vendor/three.min.js"></script>
<script src="js/data.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
